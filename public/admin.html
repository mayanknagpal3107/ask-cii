<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Ask CII — Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232b48c7' d='M12 1.8l2.3 7 7.2 2.4-7.2 2.4-2.3 7.6-2.3-7.6L2.5 11.2l7.2-2.4z'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gurmukhi", sans-serif;
      background: #f6f8fc; color: #16203a; min-height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 16px 28px; background: #fff; border-bottom: 1px solid #e8ebf2;
    }
    header h1 { font-size: 18px; }
    header h1 span { color: #2b48c7; }
    header .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    main { max-width: 1100px; margin: 0 auto; padding: 26px 20px 60px; }
    .label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #98a1b3; margin: 30px 0 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #e4e7ee; border-radius: 12px; padding: 16px 18px; }
    .card b { display: block; font-size: 26px; margin-bottom: 4px; }
    .card span { font-size: 13px; color: #8b94a7; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e4e7ee; border-radius: 12px; overflow: hidden; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f1f3f7; vertical-align: top; }
    th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #98a1b3; background: #fafbfd; }
    tr:last-child td { border-bottom: 0; }
    .chip { display: inline-block; background: #edf1fd; color: #2b48c7; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 8px; text-transform: uppercase; }
    .chip.voice { background: #fdeeed; color: #d92d20; }
    .muted { color: #8b94a7; }
    input, select, button { font: inherit; }
    input[type=password], input[type=text] {
      border: 1px solid #d7ddeb; border-radius: 10px; padding: 10px 14px; min-width: 260px;
    }
    .btn { border: 1px solid #1e3fae; background: #1e3fae; color: #fff; border-radius: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    .btn.ghost { background: #fff; color: #1e3fae; border-color: #ccd6f6; }
    .btn:disabled { opacity: .5; cursor: default; }
    select { border: 1px solid #d7ddeb; border-radius: 10px; padding: 9px 12px; background: #fff; }
    .voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .voice {
      background: #fff; border: 1px solid #e4e7ee; border-radius: 12px; padding: 14px 16px;
      cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    }
    .voice.sel { border-color: #2b48c7; box-shadow: 0 0 0 2px #dbe3fb; }
    .voice .row { display: flex; align-items: center; gap: 8px; }
    .voice b { text-transform: capitalize; }
    .voice small { color: #8b94a7; line-height: 1.5; }
    .voice .cur { margin-left: auto; font-size: 11px; color: #12805c; background: #e7f6ef; border-radius: 6px; padding: 2px 8px; font-weight: 700; }
    .voice .prev { align-self: flex-start; border: 1px solid #ccd6f6; color: #1e3fae; background: #fff; border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
    .notice { background: #fff; border: 1px solid #e4e7ee; border-left: 4px solid #2b48c7; border-radius: 10px; padding: 16px 18px; line-height: 1.7; font-size: 14px; }
    .notice code { background: #f1f3f8; border-radius: 6px; padding: 2px 7px; font-size: 13px; }
    #gate { max-width: 460px; margin: 12vh auto; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    [hidden] { display: none !important; }
    .err { color: #b42318; font-size: 14px; }
    td.q { max-width: 260px; } td.a { max-width: 380px; }
    .clip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <header>
    <h1><span>✦</span> Ask CII — Admin</h1>
    <div class="right" id="controls" hidden>
      <select id="days">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button class="btn ghost" id="refresh">Refresh</button>
      <button class="btn ghost" id="logout">Log out</button>
    </div>
  </header>

  <div id="gate">
    <h2>Admin access</h2>
    <p class="muted">Enter the admin token (set with <code>wrangler secret put ADMIN_TOKEN</code>).</p>
    <input type="password" id="token" placeholder="Admin token" />
    <button class="btn" id="login">Open dashboard</button>
    <div class="err" id="gateErr"></div>
  </div>

  <main id="dash" hidden>
    <div id="setupNotice" class="notice" hidden></div>

    <div class="label">Overview</div>
    <div class="cards" id="cards"></div>

    <div class="label">Voice of the assistant <span class="muted" style="text-transform:none;letter-spacing:0">— applies to all spoken answers</span></div>
    <div class="voices" id="voices"></div>
    <p style="margin-top:12px"><button class="btn" id="saveVoice" disabled>Save voice</button> <span id="voiceMsg" class="muted"></span></p>

    <div class="label">Top questions</div>
    <table id="topQ"><thead><tr><th>Question</th><th style="width:70px">Times</th></tr></thead><tbody></tbody></table>

    <div class="label">Languages &amp; modes</div>
    <div class="cards" id="langCards"></div>

    <div class="label">Recent questions &amp; answers</div>
    <table id="recent">
      <thead><tr><th style="width:130px">When (UTC)</th><th style="width:70px">Mode</th><th style="width:70px">Lang</th><th>Question</th><th>Answer (English)</th><th style="width:80px">Conf.</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    let TOKEN = localStorage.getItem('acii_admin_token') || '';
    let selectedVoice = null, currentVoice = null, previewAudio = null;

    const api = async (path, opts = {}) => {
      const res = await fetch(path, { ...opts, headers: { 'x-admin-token': TOKEN, 'content-type': 'application/json', ...(opts.headers || {}) } });
      if (res.status === 401) throw new Error('bad-token');
      if (res.status === 501) throw new Error((await res.json()).error || 'Not configured');
      return res;
    };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtLang = (l) => ({en:'English', hi:'Hindi', 'hi-Latn':'Hinglish', pa:'Punjabi', 'pa-Latn':'Punjabi (Latin)'}[l] || l || '—');

    async function load() {
      const days = $('#days').value;
      const [aRes, vRes] = await Promise.all([
        api(`/api/admin/analytics?days=${days}`),
        api('/api/admin/voices'),
      ]);
      const a = await aRes.json();
      const v = await vRes.json();

      $('#gate').hidden = true; $('#dash').hidden = false; $('#controls').hidden = false;

      // voices
      currentVoice = v.current; selectedVoice = selectedVoice || v.current;
      $('#voices').innerHTML = v.voices.map((x) => `
        <div class="voice ${x.id === selectedVoice ? 'sel' : ''}" data-id="${x.id}">
          <div class="row"><input type="radio" name="voice" ${x.id === selectedVoice ? 'checked' : ''}> <b>${x.id}</b>
            ${x.id === currentVoice ? '<span class="cur">CURRENT</span>' : ''}</div>
          <small>${esc(x.description)}</small>
          <button class="prev" data-voice="${x.id}">▶ Preview</button>
        </div>`).join('');
      document.querySelectorAll('.voice').forEach((el) => el.addEventListener('click', (e) => {
        if (e.target.classList.contains('prev')) return;
        selectedVoice = el.dataset.id;
        document.querySelectorAll('.voice').forEach((n) => { n.classList.toggle('sel', n.dataset.id === selectedVoice); n.querySelector('input').checked = n.dataset.id === selectedVoice; });
        $('#saveVoice').disabled = selectedVoice === currentVoice;
      }));
      document.querySelectorAll('.prev').forEach((b) => b.addEventListener('click', async () => {
        b.textContent = '…';
        try {
          const r = await api('/api/tts', { method: 'POST', body: JSON.stringify({
            text: 'Namaste! Welcome to CII — the Confederation of Indian Industry. Main aapki kya madad kar sakti hoon?',
            langName: 'Hinglish', voice: b.dataset.voice }) });
          previewAudio?.pause();
          previewAudio = new Audio(URL.createObjectURL(await r.blob()));
          await previewAudio.play();
        } catch { alert('Preview failed — is the OpenAI key configured?'); }
        b.textContent = '▶ Preview';
      }));
      $('#saveVoice').disabled = selectedVoice === currentVoice;

      // analytics
      if (!a.configured) {
        $('#setupNotice').hidden = false;
        $('#setupNotice').innerHTML = `<b>Analytics storage isn't set up yet.</b><br>
          Run: <code>npx wrangler d1 create ask-cii</code> → paste the printed <code>database_id</code>
          into the <code>d1_databases</code> block in <code>wrangler.jsonc</code> →
          <code>npx wrangler d1 execute ask-cii --remote --file=schema.sql</code> →
          <code>npm run deploy</code>. Questions will be recorded from then on.
          (Changing the voice above also needs this.)`;
        $('#cards').innerHTML = ''; $('#langCards').innerHTML = '';
        $('#topQ tbody').innerHTML = $('#recent tbody').innerHTML = '<tr><td colspan="6" class="muted">No data yet</td></tr>';
        return;
      }
      $('#setupNotice').hidden = true;
      const t = a.totals || {};
      const voiceN = (a.byMode.find((m) => m.mode === 'voice') || {}).n || 0;
      const textN = (a.byMode.find((m) => m.mode === 'text') || {}).n || 0;
      $('#cards').innerHTML = `
        <div class="card"><b>${t.asks ?? 0}</b><span>questions (${a.days}d)</span></div>
        <div class="card"><b>${textN}</b><span>typed</span></div>
        <div class="card"><b>${voiceN}</b><span>by voice</span></div>
        <div class="card"><b>${t.tts_plays ?? 0}</b><span>audio answers played</span></div>
        <div class="card"><b>${t.avg_latency ?? '—'}<small style="font-size:13px">ms</small></b><span>avg answer time</span></div>`;
      $('#langCards').innerHTML = a.byLang.map((l) => `
        <div class="card"><b>${l.n}</b><span>${fmtLang(l.lang)}</span></div>`).join('') || '<div class="muted">No data yet</div>';
      $('#topQ tbody').innerHTML = a.topQuestions.map((q) => `
        <tr><td>${esc(q.question)}</td><td>${q.n}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">No data yet</td></tr>';
      $('#recent tbody').innerHTML = a.recent.map((r) => `
        <tr>
          <td class="muted">${esc((r.ts || '').slice(0, 16))}</td>
          <td><span class="chip ${r.mode === 'voice' ? 'voice' : ''}">${esc(r.mode || '—')}</span></td>
          <td>${fmtLang(r.lang)}</td>
          <td class="q"><div class="clip">${esc(r.question)}</div></td>
          <td class="a"><div class="clip">${esc(r.summary_en || r.summary)}</div>${r.link ? ` <a href="${esc(r.link)}" target="_blank" rel="noopener">link</a>` : ''}</td>
          <td>${esc(r.confidence || '—')}</td>
        </tr>`).join('') || '<tr><td colspan="6" class="muted">No questions recorded yet — ask something in the widget!</td></tr>';
    }

    $('#saveVoice').addEventListener('click', async () => {
      $('#voiceMsg').textContent = 'Saving…';
      try {
        await api('/api/admin/settings', { method: 'POST', body: JSON.stringify({ voice: selectedVoice }) });
        currentVoice = selectedVoice;
        $('#voiceMsg').textContent = `Saved — new spoken answers use “${selectedVoice}”.`;
        load();
      } catch (e) { $('#voiceMsg').textContent = `Could not save: ${e.message}`; }
    });

    $('#login').addEventListener('click', async () => {
      TOKEN = $('#token').value.trim();
      $('#gateErr').textContent = '';
      try {
        await load();
        localStorage.setItem('acii_admin_token', TOKEN);
      } catch (e) {
        $('#gateErr').textContent = e.message === 'bad-token' ? 'That token is not valid.' : e.message;
      }
    });
    $('#logout').addEventListener('click', () => { localStorage.removeItem('acii_admin_token'); location.reload(); });
    $('#refresh').addEventListener('click', load);
    $('#days').addEventListener('change', load);
    $('#token').addEventListener('keydown', (e) => e.key === 'Enter' && $('#login').click());

    if (TOKEN) load().catch((e) => {
      $('#gateErr').textContent = e.message === 'bad-token' ? 'Saved token expired — enter it again.' : e.message;
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask CII — demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #16203a;
      background: #f6f8fc;
      min-height: 100vh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px; background: #fff; border-bottom: 1px solid #e8ebf2;
    }
    .logo { font-size: 20px; font-weight: 800; color: #1e3fae; letter-spacing: 0.02em; }
    .logo small { display: block; font-size: 11px; font-weight: 500; color: #8b94a7; letter-spacing: 0; }
    .searchbtn {
      display: inline-flex; align-items: center; gap: 10px;
      border: 1px solid #d7ddeb; background: #fff;
      border-radius: 10px; padding: 10px 16px; font: inherit; font-size: 14px;
      color: #6b7488; cursor: pointer; min-width: 260px;
    }
    .searchbtn:hover { border-color: #2b48c7; }
    .searchbtn kbd {
      margin-left: auto; background: #f1f3f8; border: 1px solid #e0e4ee;
      border-radius: 6px; padding: 2px 7px; font-size: 12px; font-family: inherit; color: #6b7488;
    }
    main { max-width: 900px; margin: 0 auto; padding: 90px 24px; text-align: center; }
    h1 { font-size: 44px; line-height: 1.2; letter-spacing: -0.02em; }
    h1 span { color: #1e3fae; }
    main p { margin: 22px auto 34px; max-width: 560px; font-size: 18px; line-height: 1.7; color: #5c667e; }
    .cta {
      display: inline-flex; align-items: center; gap: 10px;
      background: #1e3fae; color: #fff; border: 0; border-radius: 12px;
      padding: 16px 30px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
      box-shadow: 0 12px 30px rgba(30, 63, 174, 0.3);
    }
    .cta:hover { filter: brightness(1.08); }
    .hint { margin-top: 18px; font-size: 14px; color: #98a1b3; }
    .hint kbd { background: #fff; border: 1px solid #e0e4ee; border-radius: 6px; padding: 2px 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">CII<small>Confederation of Indian Industry</small></div>
    <button class="searchbtn" onclick="AskCII.open()">✦ Ask CII anything… <kbd>⌘K</kbd></button>
  </header>
  <main>
    <h1>Ask anything about <span>CII</span> — in your language, by text or voice</h1>
    <p>
      Membership, events, sectors, publications, regional offices — get an AI answer
      grounded in cii.in, with the exact page to open next. English · हिंदी · Hinglish · ਪੰਜਾਬੀ.
    </p>
    <button class="cta" onclick="AskCII.open()">✦ Ask CII</button>
    <div class="hint">or press <kbd>⌘K</kbd> / <kbd>Ctrl K</kbd> anywhere</div>
  </main>
  <script src="/widget.js" defer></script>
</body>
</html>
